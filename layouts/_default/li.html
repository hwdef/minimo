<li class='item'>
  <article class='list-entry'>
    <div class='meta'>
      {{ partial "list/date" . }}
    </div>
    <header class='item-header'>
      <h3 class='item-title'>
        <a href='{{ .Permalink | relURL }}'>
          {{- .Title -}}
        </a>
      </h3>
    </header>
    {{- with .Summary -}}
      <p class='item-summary'>{{ . | plainify }}</p>
    {{- end -}}
  </article>
</li>
